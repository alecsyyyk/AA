
    <!DOCTYPE html>
    <html>
    <head>
        <title>DFS on path Graph</title>
        <script src="https://unpkg.com/vis-network@9.1.9/dist/vis-network.min.js"></script>
        <link href="https://unpkg.com/vis-network@9.1.9/dist/dist/vis-network.min.css" rel="stylesheet" type="text/css" />
        <style>
            body {
                font-family: Arial, sans-serif;
                max-width: 1200px;
                margin: 0 auto;
                padding: 20px;
                text-align: center;
            }
            .controls {
                margin: 20px 0;
                display: flex;
                justify-content: center;
                gap: 10px;
                flex-wrap: wrap;
            }
            button {
                padding: 10px 15px;
                background-color: #4CAF50;
                color: white;
                border: none;
                border-radius: 4px;
                cursor: pointer;
            }
            button:hover {
                background-color: #45a049;
            }
            #resetButton {
                background-color: #f44336;
            }
            #resetButton:hover {
                background-color: #d32f2f;
            }
            .step-info {
                margin: 10px 0;
                font-size: 18px;
            }
            .time-info {
                margin: 5px 0;
                font-size: 16px;
                color: #666;
            }
            .meta-info {
                margin-top: 20px;
                font-size: 12px;
                color: #999;
            }
            #network {
                width: 100%;
                height: 700px;
                border: 1px solid #ddd;
                border-radius: 4px;
                margin-top: 10px;
            }
            .legend {
                display: flex;
                justify-content: center;
                gap: 18px;
                flex-wrap: wrap;
                margin-top: 12px;
                font-size: 14px;
            }
            .legend-item {
                display: flex;
                align-items: center;
                gap: 8px;
            }
            .dot {
                width: 14px;
                height: 14px;
                border-radius: 50%;
                display: inline-block;
                border: 1px solid #555;
            }
            .queue-info {
                margin: 6px 0;
                font-size: 14px;
                color: #333;
                min-height: 22px;
            }
            input[type="range"] {
                width: 200px;
            }
            .speed-wrap {
                display: inline-flex;
                align-items: center;
                gap: 8px;
                margin-left: 10px;
            }
            .controls button, .controls label {
                font-size: 14px;
            }
            .status-box {
                border: 1px solid #e0e0e0;
                border-radius: 8px;
                padding: 10px;
                max-width: 100%;
                margin-top: 10px;
                background: #fafafa;
            }
        </style>
    </head>
    <body>
        <h1>DFS on Path Graph</h1>
        
        <div class="controls">
            <button onclick="prevStep()">Previous Step</button>
            <button onclick="nextStep()">Next Step</button>
            <button onclick="playAnimation()">Play Animation</button>
            <button onclick="stopAnimation()">Stop</button>
            <button id="resetButton" onclick="resetViewer()">Reset</button>
            <span class="speed-wrap">
                <label for="speedRange">Speed:</label>
                <input id="speedRange" type="range" min="100" max="2000" step="100" value="700" oninput="updateSpeedLabel()">
                <span id="speedLabel">700 ms</span>
            </span>
        </div>

        <div class="status-box">
            <div class="step-info">
                Step <span id="currentStep">1</span> of 50
            </div>

            <div class="time-info">
                Step Time: <span id="stepTime">loading...</span> ms
            </div>

            <div class="queue-info" id="queueInfo"></div>
        </div>

        <div id="network"></div>

        <div class="legend">
            <div class="legend-item"><span class="dot" style="background:red;"></span>Current</div>
            <div class="legend-item"><span class="dot" style="background:orange;"></span>Frontier</div>
            <div class="legend-item"><span class="dot" style="background:green;"></span>Visited</div>
            <div class="legend-item"><span class="dot" style="background:lightgray;"></span>Unvisited</div>
        </div>

        <script>
            let currentStep = 1;
            let totalSteps = 50;
            let animationInterval = null;
            let graphData = null;
            let network = null;
            let nodesDataset = null;

            const defaultNodeColor = "lightgray";

            function updateSpeedLabel() {
                const speed = document.getElementById('speedRange').value;
                document.getElementById('speedLabel').textContent = `${speed} ms`;
            }

            function initNetwork(data) {
                const container = document.getElementById('network');
                const nodes = data.nodes.map(n => ({
                    id: n.id,
                    label: n.label,
                    x: n.x,
                    y: n.y,
                    fixed: true,
                    color: defaultNodeColor,
                    size: 22,
                    font: { size: 16 }
                }));

                const edges = data.edges.map(e => ({
                    from: e.from,
                    to: e.to,
                    arrows: data.directed ? 'to' : '',
                    color: '#888',
                    width: 1.5
                }));

                nodesDataset = new vis.DataSet(nodes);
                const edgesDataset = new vis.DataSet(edges);

                network = new vis.Network(
                    container,
                    { nodes: nodesDataset, edges: edgesDataset },
                    {
                        physics: false,
                        interaction: { dragNodes: false, dragView: true, zoomView: true },
                        nodes: { borderWidth: 1, shape: 'dot' }
                    }
                );
            }

            function applyStep(stepIndex) {
                if (!graphData || !graphData.steps || stepIndex < 1 || stepIndex > totalSteps) return;

                const step = graphData.steps[stepIndex - 1];
                const visited = new Set(step.visited || []);
                const frontier = new Set(step.frontier || []);
                const current = step.current;

                const updates = graphData.nodes.map(node => {
                    let color = defaultNodeColor;
                    let size = 22;

                    if (visited.has(node.id)) {
                        color = 'green';
                    }
                    if (frontier.has(node.id)) {
                        color = 'orange';
                    }
                    if (node.id === current) {
                        color = 'red';
                        size = 28;
                    }

                    return { id: node.id, color: color, size: size };
                });

                nodesDataset.update(updates);

                document.getElementById('currentStep').textContent = stepIndex;
                document.getElementById('stepTime').textContent = Number(step.step_time_ms || 0).toFixed(4);

                if (graphData.algorithm === 'BFS') {
                    document.getElementById('queueInfo').textContent = `Queue: [${(step.queue || []).join(', ')}]`;
                } else {
                    document.getElementById('queueInfo').textContent = '';
                }
            }

            fetch('graph_data.json')
                .then(response => response.json())
                .then(data => {
                    graphData = data;
                    totalSteps = data.steps.length;
                    initNetwork(data);
                    applyStep(1);
                })
                .catch(error => {
                    console.error('Error loading graph data:', error);
                    document.getElementById('stepTime').textContent = 'N/A';
                });

            function nextStep() {
                if (currentStep < totalSteps) {
                    currentStep++;
                    applyStep(currentStep);
                }
            }

            function prevStep() {
                if (currentStep > 1) {
                    currentStep--;
                    applyStep(currentStep);
                }
            }

            function playAnimation() {
                if (animationInterval) clearInterval(animationInterval);
                const delay = Number(document.getElementById('speedRange').value || 700);
                animationInterval = setInterval(() => {
                    nextStep();
                    if (currentStep === totalSteps) {
                        stopAnimation();
                    }
                }, delay);
            }

            function stopAnimation() {
                if (animationInterval) {
                    clearInterval(animationInterval);
                    animationInterval = null;
                }
            }

            function resetViewer() {
                stopAnimation();
                currentStep = 1;
                applyStep(currentStep);
            }

            updateSpeedLabel();
        </script>
    </body>
    </html>
